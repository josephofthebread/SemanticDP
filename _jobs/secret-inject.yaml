name: SemanticDP-secret-inject
desc: Publish a span-annotated secret-containing dataset that gendata can perturb
cmd: python3 privacy.py inject --split nemotron_train:latest --name nemotron_secret_train
env:
  vars:
    - WANDB_ENTITY: josephofthebread
    - WANDB_PROJECT: SemanticDP
  python:
    type: manual
    version: "3.12"
    requirements-file: requirements-data.txt
    local-paths:
      - privacy.py
cloud-instance-types:
  - c1.4

name: SemanticDP-secret-variants
desc: Build uniform and entity-targeted sanitization of the secret-contaning dataset
cmd: python3 gendata.py --variants-only --datasets nemotron_secret_train --m1 "" --m2 "1,3" --m2-entity "1,3"
env:
  vars:
    - WANDB_ENTITY: josephofthebread
    - WANDB_PROJECT: SemanticDP
  python:
    type: manual
    version: "3.12"
    requirements-file: requirements-data.txt
    local-paths:
      - gendata.py
cloud-instance-types:
  - c1.4

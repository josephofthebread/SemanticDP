name: SemanticDP-results
desc: Aggregate all runs into result CSVs
cmd: python3 results.py
env:
  docker:
    image: docker.io/pytorch/pytorch:2.10.0-cuda12.6-cudnn9-runtime
  vars:
    - PIP_BREAK_SYSTEM_PACKAGES: "1"
    - WANDB_ENTITY: josephofthebread
    - WANDB_PROJECT: SemanticDP
  python:
    type: manual
    version: "3.12"
    requirements-file: requirements-data.txt
    local-paths:
      - results.py
cloud-instance-types:
  - c1.4
